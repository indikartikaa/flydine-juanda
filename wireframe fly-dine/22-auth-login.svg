<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <!-- ========================================================================= -->
  <!-- WIREFRAME PERSIS: LOGIN PORTAL ADMIN & TENANT (/login)                    -->
  <!-- Murni Kotak-Kotak Struktur (Skeleton Wireframe - Tanpa Browser Frame)     -->
  <!-- Mengikuti: resources/views/auth/login.blade.php                           -->
  <!-- ========================================================================= -->

  <!-- ==========================================
       KIRI: VISUAL BRANDING AIRPORT (59% ~ 850px)
       ========================================== -->
  <g id="Left-Branding-Section">
    <!-- Background Image Airport dengan Overlay Gelap [X] -->
    <rect x="0" y="0" width="850" height="900" fill="#004C80" />
    <line x1="0" y1="0" x2="850" y2="900" stroke="#00355A" stroke-width="2" />
    <line x1="850" y1="0" x2="0" y2="900" stroke="#00355A" stroke-width="2" />
    <rect x="0" y="0" width="850" height="900" fill="#002D4C" opacity="0.65" />

    <!-- Konten Visual Branding di Kiri (Tengah Vertikal) -->
    <g transform="translate(80, 240)">
      <!-- Headline Teks Utama (3 baris tebal) -->
      <line x1="0" y1="0" x2="580" y2="0" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
      <line x1="0" y1="26" x2="620" y2="26" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
      <line x1="0" y1="52" x2="440" y2="52" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

      <!-- Deskripsi Pendukung (2 baris) -->
      <line x1="0" y1="100" x2="560" y2="100" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" opacity="0.9" />
      <line x1="0" y1="120" x2="480" y2="120" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" opacity="0.9" />

      <!-- 2 Badge Kartu Kaca (Lokasi & Sistem) -->
      <g transform="translate(0, 160)">
        <!-- Badge 1: Lokasi (T1, T2 Bandara Juanda) -->
        <rect width="180" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
        <line x1="20" y1="26" x2="80" y2="26" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
        <line x1="20" y1="50" x2="150" y2="50" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

        <!-- Badge 2: Sistem (FlyDine) -->
        <g transform="translate(200, 0)">
          <rect width="160" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
          <line x1="20" y1="26" x2="70" y2="26" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
          <line x1="20" y1="50" x2="120" y2="50" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
        </g>
      </g>
    </g>
  </g>

  <!-- ==========================================
       KANAN: AREA FORM LOGIN (41% ~ 590px)
       ========================================== -->
  <g id="Right-Form-Section" transform="translate(850, 0)">
    <rect width="590" height="900" fill="#F8FAFC" />

    <!-- Tombol Switcher Bahasa (Kanan Atas) -->
    <g transform="translate(480, 32)">
      <rect width="80" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <rect x="3" y="3" width="36" height="28" rx="6" fill="#005EA2" />
      <line x1="12" y1="17" x2="30" y2="17" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="49" y1="17" x2="67" y2="17" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Kontainer Tengah Form Login (width 420px, x = (590 - 420)/2 = 85) -->
    <g transform="translate(85, 90)">

      <!-- 1. DUAL LOGO CARD (Angkasa Pura & FlyDine) -->
      <g transform="translate(45, 0)">
        <rect width="330" height="64" rx="16" fill="#FFFFFF" stroke="#27272A" stroke-width="1.5" />
        
        <!-- Logo 1: Angkasa Pura [X] -->
        <rect x="24" y="14" width="100" height="36" rx="6" fill="#F4F4F5" stroke="#71717A" stroke-width="1" />
        <line x1="24" y1="14" x2="124" y2="50" stroke="#A1A1AA" stroke-width="1" />
        <line x1="124" y1="14" x2="24" y2="50" stroke="#A1A1AA" stroke-width="1" />

        <!-- Vertical Divider -->
        <line x1="150" y1="16" x2="150" y2="48" stroke="#D4D4D8" stroke-width="1.5" />

        <!-- Logo 2: FlyDine [X] -->
        <rect x="176" y="14" width="130" height="36" rx="6" fill="#F4F4F5" stroke="#71717A" stroke-width="1" />
        <line x1="176" y1="14" x2="306" y2="50" stroke="#A1A1AA" stroke-width="1" />
        <line x1="306" y1="14" x2="176" y2="50" stroke="#A1A1AA" stroke-width="1" />
      </g>

      <!-- 2. BLUE CARD LOGIN FORM (baris 82-162) -->
      <g transform="translate(0, 84)">
        <rect width="420" height="530" rx="28" fill="#005EA2" stroke="#27272A" stroke-width="2" />

        <!-- Header Card: Welcome Back & Subtitle -->
        <g transform="translate(36, 44)">
          <line x1="84" y1="0" x2="264" y2="0" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
          <line x1="54" y1="24" x2="294" y2="24" stroke="#BAE6FD" stroke-width="4.5" stroke-linecap="round" />
        </g>

        <!-- Form Elements Container -->
        <g transform="translate(36, 120)">

          <!-- FIELD 1: EMAIL -->
          <g transform="translate(0, 0)">
            <!-- Label -->
            <line x1="0" y1="0" x2="50" y2="0" stroke="#F0F9FF" stroke-width="4" stroke-linecap="round" />
            <!-- Input Box -->
            <rect y="12" width="348" height="48" rx="12" fill="#FFFFFF" stroke="#27272A" stroke-width="1.5" />
            <line x1="18" y1="36" x2="240" y2="36" stroke="#A1A1AA" stroke-width="4" stroke-linecap="round" />
          </g>

          <!-- FIELD 2: PASSWORD -->
          <g transform="translate(0, 88)">
            <!-- Label -->
            <line x1="0" y1="0" x2="70" y2="0" stroke="#F0F9FF" stroke-width="4" stroke-linecap="round" />
            <!-- Input Box with Eye Icon -->
            <rect y="12" width="348" height="48" rx="12" fill="#FFFFFF" stroke="#27272A" stroke-width="1.5" />
            <!-- Password Dots / Line Placeholder -->
            <circle cx="24" cy="36" r="3.5" fill="#71717A" />
            <circle cx="38" cy="36" r="3.5" fill="#71717A" />
            <circle cx="52" cy="36" r="3.5" fill="#71717A" />
            <circle cx="66" cy="36" r="3.5" fill="#71717A" />
            <circle cx="80" cy="36" r="3.5" fill="#71717A" />
            <circle cx="94" cy="36" r="3.5" fill="#71717A" />
            <circle cx="108" cy="36" r="3.5" fill="#71717A" />
            <circle cx="122" cy="36" r="3.5" fill="#71717A" />

            <!-- Eye Icon [O] -->
            <ellipse cx="318" cy="36" rx="10" ry="6" fill="none" stroke="#71717A" stroke-width="1.5" />
            <circle cx="318" cy="36" r="3" fill="#71717A" />
          </g>

          <!-- CHECKBOX REMEMBER ME & FORGOT PASSWORD LINK -->
          <g transform="translate(0, 180)">
            <!-- Checkbox -->
            <rect y="2" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#27272A" stroke-width="1.5" />
            <!-- Checkmark / placeholder line -->
            <line x1="26" y1="10" x2="110" y2="10" stroke="#E0F2FE" stroke-width="3.5" stroke-linecap="round" />

            <!-- Forgot Password Link -->
            <line x1="220" y1="10" x2="348" y2="10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
          </g>

          <!-- PRIMARY SUBMIT BUTTON: LOGIN -->
          <g transform="translate(0, 224)">
            <rect width="348" height="52" rx="14" fill="#FFFFFF" stroke="#27272A" stroke-width="1.8" />
            <!-- Button Text Line -->
            <line x1="140" y1="26" x2="196" y2="26" stroke="#005EA2" stroke-width="6" stroke-linecap="round" />
            <!-- Arrow Right Icon -->
            <path d="M210 21 L216 26 L210 31" fill="none" stroke="#005EA2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </g>

        </g>
      </g>

      <!-- 3. FOOTER COPYRIGHT -->
      <g transform="translate(85, 640)">
        <line x1="0" y1="0" x2="250" y2="0" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
      </g>

    </g>
  </g>

</svg>
