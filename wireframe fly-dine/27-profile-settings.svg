          <line x1="0" y1="52" x2="360" y2="52" stroke="#71717A" stroke-width="3.5" stroke-linecap="round" />
          <line x1="0" y1="70" x2="300" y2="70" stroke="#71717A" stroke-width="3.5" stroke-linecap="round" />

