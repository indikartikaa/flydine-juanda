      <g transform="translate(0, 0)">
        <circle cx="20" cy="20" r="18" fill="#FFFFFF" stroke="#27272A" stroke-width="1.5" />
        <path d="M23 13 L16 20 L23 27" fill="none" stroke="#27272A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
