        <line x1="12" y1="20" x2="28" y2="20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
        <circle cx="34" cy="34" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
      </g>
    </g>
  </g>

