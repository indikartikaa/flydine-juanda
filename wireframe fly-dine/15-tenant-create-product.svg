      <rect width="228" height="46" rx="12" fill="#FFFFFF" />
      <circle cx="25" cy="23" r="9" fill="none" stroke="#71717A" stroke-width="1.8" />
      <path d="M25 18 V23 H28" stroke="#71717A" stroke-width="1.5" fill="none" />
      <line x1="44" y1="23" x2="170" y2="23" stroke="#52525B" stroke-width="5" stroke-linecap="round" />
    </g>

