              <rect x="0" y="20" width="314" height="48" rx="12" fill="#F4F4F5" stroke="#27272A" stroke-width="1.5" />
              <line x1="18" y1="44" x2="140" y2="44" stroke="#71717A" stroke-width="4" stroke-linecap="round" />
