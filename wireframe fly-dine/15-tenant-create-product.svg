              <circle cx="32" cy="12" r="9" fill="#FFFFFF" />
              <line x1="56" y1="12" x2="170" y2="12" stroke="#18181B" stroke-width="5" stroke-linecap="round" />
            </g>

            <!-- Input Stok Awal -->
            <g transform="translate(0, 84)">
              <line x1="0" y1="8" x2="80" y2="8" stroke="#52525B" stroke-width="4" stroke-linecap="round" />
              <rect x="0" y="18" width="320" height="42" rx="10" fill="#F4F4F5" stroke="#27272A" stroke-width="1.2" />
              <line x1="14" y1="39" x2="80" y2="39" stroke="#71717A" stroke-width="4" stroke-linecap="round" />
            </g>

            <!-- Input Estimasi Waktu Masak -->
            <g transform="translate(0, 168)">
              <line x1="0" y1="8" x2="160" y2="8" stroke="#52525B" stroke-width="4" stroke-linecap="round" />
              <rect x="0" y="18" width="320" height="42" rx="10" fill="#F4F4F5" stroke="#27272A" stroke-width="1.2" />
              <circle cx="20" cy="39" r="6" fill="none" stroke="#71717A" stroke-width="1.5" />
              <line x1="36" y1="39" x2="100" y2="39" stroke="#71717A" stroke-width="4" stroke-linecap="round" />
            </g>
          </g>
        </g>

        <!-- TOMBOL AKSI SIMPAN & BATAL -->
        <g transform="translate(0, 660)">
          <!-- Tombol Simpan Menu Baru (CTA) -->
          <rect width="368" height="52" rx="16" fill="#27272A" />
          <line x1="110" y1="26" x2="258" y2="26" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

          <!-- Tombol Batal -->
          <g transform="translate(0, 64)">
            <rect width="368" height="46" rx="14" fill="#FFFFFF" stroke="#27272A" stroke-width="1.5" />
            <line x1="150" y1="23" x2="218" y2="23" stroke="#27272A" stroke-width="5" stroke-linecap="round" />
          </g>
