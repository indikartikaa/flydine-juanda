<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" width="1440" height="1080" style="background:#F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <!-- ========================================================================= -->
  <!-- WIREFRAME PERSIS: TAMBAH PRODUK BARU TENANT (/tenant/products/create)     -->
  <!-- Murni Kotak-Kotak Struktur (Skeleton Wireframe - Tanpa Browser Frame)     -->
  <!-- Mengikuti: resources/views/tenant/create-product.blade.php & layouts      -->
  <!-- ========================================================================= -->

  <!-- 1. SIDEBAR TENANT -->
  <g id="Sidebar">
