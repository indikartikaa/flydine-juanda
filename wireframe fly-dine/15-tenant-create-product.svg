            <rect x="0" y="20" width="656" height="150" rx="14" fill="#F4F4F5" stroke="#27272A" stroke-width="1.5" />
            <line x1="18" y1="44" x2="380" y2="44" stroke="#71717A" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 3" />
            <line x1="18" y1="64" x2="320" y2="64" stroke="#71717A" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 3" />
          </g>

