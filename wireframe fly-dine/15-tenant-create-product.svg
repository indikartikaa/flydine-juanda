              <line x1="90" y1="120" x2="230" y2="120" stroke="#18181B" stroke-width="4.5" stroke-linecap="round" />
              <line x1="110" y1="136" x2="210" y2="136" stroke="#71717A" stroke-width="3" stroke-linecap="round" />
