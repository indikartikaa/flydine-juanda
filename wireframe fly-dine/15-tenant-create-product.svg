      <line x1="44" y1="23" x2="140" y2="23" stroke="#52525B" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Nav 2: Manajemen Pesanan -->
    <g transform="translate(16, 186)">
      <rect width="228" height="46" rx="12" fill="#FFFFFF" />
      <rect x="16" y="14" width="18" height="18" rx="3" fill="none" stroke="#71717A" stroke-width="1.8" />
      <line x1="44" y1="23" x2="180" y2="23" stroke="#52525B" stroke-width="5" stroke-linecap="round" />
    </g>

