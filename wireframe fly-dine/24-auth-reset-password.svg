<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <!-- ========================================================================= -->
  <!-- WIREFRAME PERSIS: RESET KATA SANDI BARU (/reset-password)                 -->
  <!-- Murni Kotak-Kotak Struktur (Skeleton Wireframe - Tanpa Browser Frame)     -->
  <!-- Mengikuti: resources/views/auth/reset-password.blade.php                  -->
  <!-- ========================================================================= -->

  <!-- ==========================================
       KIRI: VISUAL BRANDING AIRPORT (59% ~ 850px)
       ========================================== -->
  <g id="Left-Branding-Section">
    <!-- Background Image Airport dengan Overlay Gelap [X] -->
    <rect x="0" y="0" width="850" height="900" fill="#004C80" />
    <line x1="0" y1="0" x2="850" y2="900" stroke="#00355A" stroke-width="2" />
    <line x1="850" y1="0" x2="0" y2="900" stroke="#00355A" stroke-width="2" />
    <rect x="0" y="0" width="850" height="900" fill="#002D4C" opacity="0.65" />

    <!-- Konten Visual Branding di Kiri -->
    <g transform="translate(80, 240)">
      <!-- Headline: Buat Kata Sandi Baru -->
      <line x1="0" y1="0" x2="520" y2="0" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
      <line x1="0" y1="26" x2="420" y2="26" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

      <!-- Deskripsi -->
      <line x1="0" y1="76" x2="560" y2="76" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" opacity="0.9" />
      <line x1="0" y1="96" x2="440" y2="96" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" opacity="0.9" />

      <!-- 2 Badge: Lokasi & Keamanan -->
      <g transform="translate(0, 140)">
        <!-- Badge 1: Lokasi -->
        <rect width="180" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
        <line x1="20" y1="26" x2="80" y2="26" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
        <line x1="20" y1="50" x2="150" y2="50" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

        <!-- Badge 2: Keamanan -->
        <g transform="translate(200, 0)">
          <rect width="170" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
          <line x1="20" y1="26" x2="90" y2="26" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
          <line x1="20" y1="50" x2="140" y2="50" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
        </g>
      </g>
    </g>
  </g>

  <!-- ==========================================
       KANAN: AREA FORM RESET KATA SANDI (41% ~ 590px)
       ========================================== -->
  <g id="Right-Form-Section" transform="translate(850, 0)">
    <rect width="590" height="900" fill="#F8FAFC" />

    <!-- Tombol Switcher Bahasa (Kanan Atas) -->
    <g transform="translate(480, 32)">
      <rect width="80" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <rect x="3" y="3" width="36" height="28" rx="6" fill="#005EA2" />
      <line x1="12" y1="17" x2="30" y2="17" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="49" y1="17" x2="67" y2="17" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Kontainer Tengah Form (width 420px, x = 85) -->
    <g transform="translate(85, 60)">

      <!-- 1. DUAL LOGO CARD -->
      <g transform="translate(45, 0)">
        <rect width="330" height="64" rx="16" fill="#FFFFFF" stroke="#27272A" stroke-width="1.5" />
        
        <!-- Logo 1: Angkasa Pura [X] -->
        <rect x="24" y="14" width="100" height="36" rx="6" fill="#F4F4F5" stroke="#71717A" stroke-width="1" />
        <line x1="24" y1="14" x2="124" y2="50" stroke="#A1A1AA" stroke-width="1" />
        <line x1="124" y1="14" x2="24" y2="50" stroke="#A1A1AA" stroke-width="1" />

        <!-- Vertical Divider -->
        <line x1="150" y1="16" x2="150" y2="48" stroke="#D4D4D8" stroke-width="1.5" />

        <!-- Logo 2: FlyDine [X] -->
        <rect x="176" y="14" width="130" height="36" rx="6" fill="#F4F4F5" stroke="#71717A" stroke-width="1" />
        <line x1="176" y1="14" x2="306" y2="50" stroke="#A1A1AA" stroke-width="1" />
        <line x1="306" y1="14" x2="176" y2="50" stroke="#A1A1AA" stroke-width="1" />
      </g>

      <!-- 2. BLUE CARD FORM RESET KATA SANDI -->
      <g transform="translate(0, 80)">
        <rect width="420" height="570" rx="28" fill="#005EA2" stroke="#27272A" stroke-width="2" />

        <!-- Header Card -->
        <g transform="translate(36, 36)">
          <line x1="74" y1="0" x2="274" y2="0" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
          <line x1="44" y1="24" x2="304" y2="24" stroke="#BAE6FD" stroke-width="4.5" stroke-linecap="round" />
        </g>

        <!-- Form Elements -->
        <g transform="translate(36, 95)">

          <!-- FIELD 1: EMAIL TERDAFTAR -->
          <g transform="translate(0, 0)">
            <line x1="0" y1="0" x2="120" y2="0" stroke="#F0F9FF" stroke-width="4" stroke-linecap="round" />
            <rect y="12" width="348" height="46" rx="12" fill="#F8FAFC" stroke="#27272A" stroke-width="1.5" />
            <line x1="18" y1="35" x2="210" y2="35" stroke="#71717A" stroke-width="4" stroke-linecap="round" />
          </g>

          <!-- FIELD 2: KATA SANDI BARU -->
          <g transform="translate(0, 80)">
            <line x1="0" y1="0" x2="120" y2="0" stroke="#F0F9FF" stroke-width="4" stroke-linecap="round" />
            <rect y="12" width="348" height="46" rx="12" fill="#FFFFFF" stroke="#27272A" stroke-width="1.5" />
            <!-- Password Dots -->
            <circle cx="24" cy="35" r="3.5" fill="#71717A" />
            <circle cx="38" cy="35" r="3.5" fill="#71717A" />
            <circle cx="52" cy="35" r="3.5" fill="#71717A" />
            <circle cx="66" cy="35" r="3.5" fill="#71717A" />
            <circle cx="80" cy="35" r="3.5" fill="#71717A" />
            <circle cx="94" cy="35" r="3.5" fill="#71717A" />
            <circle cx="108" cy="35" r="3.5" fill="#71717A" />
            <circle cx="122" cy="35" r="3.5" fill="#71717A" />

            <!-- Eye Icon -->
            <ellipse cx="318" cy="35" rx="10" ry="6" fill="none" stroke="#71717A" stroke-width="1.5" />
            <circle cx="318" cy="35" r="3" fill="#71717A" />
          </g>

          <!-- FIELD 3: KONFIRMASI KATA SANDI -->
          <g transform="translate(0, 160)">
            <line x1="0" y1="0" x2="160" y2="0" stroke="#F0F9FF" stroke-width="4" stroke-linecap="round" />
            <rect y="12" width="348" height="46" rx="12" fill="#FFFFFF" stroke="#27272A" stroke-width="1.5" />
            <!-- Password Dots -->
            <circle cx="24" cy="35" r="3.5" fill="#71717A" />
            <circle cx="38" cy="35" r="3.5" fill="#71717A" />
            <circle cx="52" cy="35" r="3.5" fill="#71717A" />
            <circle cx="66" cy="35" r="3.5" fill="#71717A" />
            <circle cx="80" cy="35" r="3.5" fill="#71717A" />
            <circle cx="94" cy="35" r="3.5" fill="#71717A" />
            <circle cx="108" cy="35" r="3.5" fill="#71717A" />
            <circle cx="122" cy="35" r="3.5" fill="#71717A" />

            <!-- Eye Icon -->
            <ellipse cx="318" cy="35" rx="10" ry="6" fill="none" stroke="#71717A" stroke-width="1.5" />
            <circle cx="318" cy="35" r="3" fill="#71717A" />
          </g>

          <!-- PRIMARY SUBMIT BUTTON: SIMPAN KATA SANDI BARU -->
          <g transform="translate(0, 240)">
            <rect width="348" height="52" rx="14" fill="#FFFFFF" stroke="#27272A" stroke-width="1.8" />
            <line x1="80" y1="26" x2="250" y2="26" stroke="#005EA2" stroke-width="6" stroke-linecap="round" />
            <path d="M260 21 L266 26 L260 31" fill="none" stroke="#005EA2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </g>

        </g>
      </g>

      <!-- 3. TOMBOL KEMBALI KE LOGIN & FOOTER -->
      <g transform="translate(0, 665)">
        <!-- Back to Login Button -->
        <g transform="translate(120, 0)">
          <rect width="180" height="42" rx="21" fill="#FFFFFF" stroke="#27272A" stroke-width="1.5" />
          <path d="M36 21 L28 21 M28 21 L33 16 M28 21 L33 26" fill="none" stroke="#27272A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <line x1="46" y1="21" x2="150" y2="21" stroke="#27272A" stroke-width="4.5" stroke-linecap="round" />
        </g>

        <!-- Copyright Line -->
        <line x1="85" y1="62" x2="335" y2="62" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
      </g>

    </g>
  </g>

</svg>
