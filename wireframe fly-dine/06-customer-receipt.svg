      <line x1="400" y1="15" x2="800" y2="15" stroke="#71717A" stroke-width="3.5" stroke-linecap="round" />
      <line x1="1100" y1="15" x2="1280" y2="15" stroke="#71717A" stroke-width="3.5" stroke-linecap="round" />
