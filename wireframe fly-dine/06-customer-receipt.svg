<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1560" width="1440" height="1560" style="background:#F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <!-- ========================================================================= -->
  <!-- WIREFRAME PERSIS: STRUK DIGITAL RESMI (/receipt/{order})                  -->
  <!-- Murni Kotak-Kotak Struktur (Skeleton Wireframe - Widescreen Dual Column)  -->
  <!-- Mengikuti: resources/views/customer/receipt.blade.php                     -->
  <!-- ========================================================================= -->

  <!-- 1. TOP NAVBAR (receipt.blade.php baris 126-158) -->
  <g id="Top-Navbar">
    <rect x="0" y="0" width="1440" height="76" fill="#FFFFFF" stroke="#27272A" stroke-width="2" />

    <!-- A. Kiri: Logo Brand & Divider "Struk Transaksi Resmi" -->
    <g transform="translate(60, 18)">
      <rect width="160" height="40" rx="6" fill="#F4F4F5" stroke="#27272A" stroke-width="1.8" />
