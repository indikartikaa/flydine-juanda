        <rect width="130" height="36" rx="10" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.2" />
        <path d="M20 18 L26 12 M20 18 L26 24" stroke="#27272A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="36" y1="18" x2="114" y2="18" stroke="#27272A" stroke-width="4" stroke-linecap="round" />
      </g>

      <!-- Tombol: Cetak / PDF -->
      <g transform="translate(144, 0)">
        <rect width="126" height="36" rx="10" fill="#27272A" stroke="#18181B" stroke-width="1.5" />
        <rect x="16" y="10" width="16" height="16" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
        <line x1="20" y1="14" x2="28" y2="14" stroke="#FFFFFF" stroke-width="1.5" />
        <line x1="42" y1="18" x2="108" y2="18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
