<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1480" width="540" height="1480" style="background:#F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <!-- ========================================================================= -->
  <!-- WIREFRAME PERSIS: STRUK DIGITAL RESMI (/receipt/{order})                  -->
