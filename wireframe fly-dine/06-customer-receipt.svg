        <line x1="240" y1="12" x2="256" y2="12" stroke="#52525B" stroke-width="4" stroke-linecap="round" />
        <line x1="360" y1="12" x2="432" y2="12" stroke="#18181B" stroke-width="5" stroke-linecap="round" />
      </g>

