  <!-- ========================================================================= -->

  <!-- 1. TOP APP BAR (receipt.blade.php baris 16-31) -->
  <g id="Top-AppBar">
    <rect x="0" y="0" width="540" height="68" fill="#27272A" />

    <!-- Tombol Back [<] -->
    <g transform="translate(20, 16)">
      <circle cx="18" cy="18" r="18" fill="#3F3F46" />
      <path d="M21 12 L15 18 L21 24" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Title Struk Digital & FlyDine Juanda -->
    <g transform="translate(68, 20)">
      <line x1="0" y1="10" x2="110" y2="10" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="24" x2="160" y2="24" stroke="#A1A1AA" stroke-width="3.5" stroke-linecap="round" />
    </g>

